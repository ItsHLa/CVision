<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVision - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #020617;
            --bg-surface: rgba(15, 23, 42, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ── Pretty Glass Navbar ── */
        .navbar {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            padding: 0;
            z-index: 100;
            height: 60px;
            display: flex;
            align-items: center;
            isolation: isolate;
        }

        .navbar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(59, 130, 246, 0.3) 20%,
                rgba(99, 102, 241, 0.5) 50%,
                rgba(59, 130, 246, 0.3) 80%,
                transparent 100%
            );
            animation: navGlow 3s ease-in-out infinite alternate;
        }

        @keyframes navGlow {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .navbar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 400px 40px at 50% 100%, rgba(59, 130, 246, 0.06), transparent);
            pointer-events: none;
        }

        .nav-inner {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            text-decoration: none;
            position: relative;
        }

        .logo-link .logo-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.1));
            border: 1px solid rgba(96, 165, 250, 0.2);
            animation: logoPulse 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 11px;
            background: conic-gradient(from 0deg, transparent, rgba(59,130,246,0.15), transparent, rgba(99,102,241,0.1), transparent);
            animation: logoSpin 4s linear infinite;
            z-index: -1;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.15); }
            50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
        }

        @keyframes logoSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f1f5f9 0%, #93c5fd 50%, #60a5fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: #64748b;
            font-weight: 500;
        }

        .status-dot::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .nav-cta {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff !important;
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .nav-cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg,
                transparent 30%,
                rgba(255, 255, 255, 0.12) 45%,
                rgba(255, 255, 255, 0.15) 50%,
                rgba(255, 255, 255, 0.12) 55%,
                transparent 70%
            );
            transform: translateX(-100%) skewX(-15deg);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-cta:hover::before {
            transform: translateX(100%) skewX(-15deg);
        }

        .nav-cta:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
        }

        .nav-cta:active {
            transform: scale(0.97);
        }

        /* ── Main Chat Container ── */
        .main-chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(900px 600px at 50% -8%, rgba(37, 99, 235, 0.07), transparent),
                radial-gradient(500px 300px at 80% 90%, rgba(99, 102, 241, 0.04), transparent),
                var(--bg-deep);
        }

        /* subtle noise texture overlay */
        .main-chat-container::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Messages Area ── */
        .chat-scroll-area {
            flex: 1;
            width: 100%;
            max-width: 800px;
            overflow-y: auto;
            padding: 2rem 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }

        .chat-scroll-area::-webkit-scrollbar { width: 4px; }
        .chat-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }
        .chat-scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.12); }

        /* ── Messages ── */
        .msg {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            max-width: 100%;
            animation: msgIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            min-width: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .msg.bot .msg-avatar {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(37, 99, 235, 0.08));
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
        }

        .msg.user .msg-avatar {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .msg-bubble {
            max-width: min(100%, 580px);
            font-size: 0.925rem;
            line-height: 1.7;
            position: relative;
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            transition: box-shadow 0.2s ease;
        }

        .msg.bot .msg-bubble {
            background: rgba(15, 23, 42, 0.65);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top-left-radius: 4px;
            padding-right: 2.75rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .msg.user .msg-bubble {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }

        .msg-bubble p {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg-bubble p:empty::before {
            content: '\200B';
        }

        .msg-bubble a {
            color: #93c5fd;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .msg-bubble code {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
        }

        .msg-bubble pre {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .msg-bubble pre code {
            background: none;
            padding: 0;
        }

        .msg-time {
            display: block;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0.35rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .msg.user .msg-time {
            text-align: right;
            color: rgba(255, 255, 255, 0.45);
        }

        .msg.bot .msg-time {
            color: #64748b;
        }

        /* ── Copy Button ── */
        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #64748b;
            cursor: pointer;
            padding: 5px;
            border-radius: 7px;
            opacity: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .msg.bot:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ── Typing Indicator ── */
        .typing-indicator .msg-bubble {
            padding-right: 1.2rem;
        }

        .typing-text {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #94a3b8;
        }

        .typing-text::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            display: inline-block;
            animation: typingDot 1.4s ease-in-out infinite;
        }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* ── Suggestions ── */
        .chat-suggestions {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 0 1.5rem 1.25rem;
            animation: fadeUp 0.5s ease 0.3s both;
            position: relative;
            z-index: 1;
        }

        .chat-suggestions span {
            font-size: 0.82rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            padding: 0.45rem 1rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            backdrop-filter: blur(4px);
        }

        .chat-suggestions span:hover {
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(96, 165, 250, 0.3);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15);
        }

        .chat-suggestions.fade-out {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* ── Input Area ── */
        .chat-input-wrapper {
            width: 100%;
            padding: 0.75rem 1.5rem 1.5rem;
            background: linear-gradient(to top, var(--bg-deep) 60%, transparent);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .chat-input-area {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px) saturate(1.3);
            -webkit-backdrop-filter: blur(16px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 20px;
            padding: 0.45rem 0.5rem 0.45rem 1rem;
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chat-input-area:focus-within {
            border-color: rgba(59, 130, 246, 0.35);
            background: rgba(15, 23, 42, 0.96);
            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.925rem;
            padding: 0.6rem 0;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        .chat-input::placeholder { color: #475569; }

        .chat-attach-btn {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .chat-attach-btn:hover {
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-send {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
        }

        .chat-send:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.4);
        }

        .chat-send:active { transform: scale(0.92); }

        .chat-send:disabled {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        /* ── Animations ── */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .chat-scroll-area { padding: 1.25rem 1rem; gap: 1rem; }
            .msg-bubble { max-width: 92%; font-size: 0.9rem; padding: 0.8rem 1rem; }
            .msg.bot .msg-bubble { padding-right: 2.25rem; }
            .msg-avatar { width: 28px; height: 28px; min-width: 28px; }
            .chat-suggestions { padding: 0 1rem 1rem; gap: 0.4rem; }
            .chat-suggestions span { font-size: 0.78rem; padding: 0.35rem 0.8rem; }
            .chat-input-wrapper { padding: 0.5rem 1rem 1rem; }
            .chat-input-area { border-radius: 16px; padding: 0.35rem 0.4rem 0.35rem 0.8rem; }
            .navbar { height: 54px; }
            .nav-inner { padding: 0 1rem; }
            .nav-cta { padding: 0.4rem 0.9rem; font-size: 0.78rem; }
            .status-dot { display: none; }
        }

        @media (max-width: 480px) {
            .chat-scroll-area { padding: 1rem 0.75rem; }
            .chat-input-wrapper { padding: 0.5rem 0.75rem 0.875rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="logo-link">
                <span class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"/>
                    </svg>
                </span>
                <span class="logo-text">CVision</span>
            </a>
            <div class="nav-right">
                <span class="status-dot">Online</span>
                <a href="chat.html" class="nav-cta">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </a>
            </div>
        </div>
    </nav>

    <!-- Chat Interface -->
    <div class="main-chat-container">
        <!-- Messages Area -->
        <div class="chat-scroll-area" id="chatMessages">
            <div class="msg bot">
                <div class="msg-avatar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8V4H8" />
                        <rect width="16" height="12" x="4" y="8" rx="2" />
                        <path d="M2 14h2" /><path d="M20 14h2" />
                        <path d="M15 13v2" /><path d="M9 13v2" />
                    </svg>
                </div>
                <div class="msg-bubble">
                    <p>Welcome to CVision! I can help you analyze your CV against a job description. Please paste the Job Description to get started.</p>
                </div>
            </div>
        </div>

        <!-- Suggestions -->
        <div class="chat-suggestions" id="chatSuggestions"></div>

        <!-- Input -->
        <div class="chat-input-wrapper">
            <div class="chat-input-area">
                <button class="chat-attach-btn" aria-label="Attach File" id="chatAttachBtn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke-width="2.5"></path>
                    </svg>
                </button>

                <input type="file" id="chatFileInput" hidden />

                <textarea class="chat-input" id="chatInput" placeholder="Message CVision or drop a file..." autocomplete="off" rows="1"></textarea>
                
                <button class="chat-send" type="button" aria-label="Send message" id="chatSendBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
