<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVision - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #020617;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(59, 130, 246, 0.35);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #f1f5f9 0%, #93c5fd 50%, #60a5fa 100%);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* ── Navbar ── */
        .navbar {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            background: rgba(2, 6, 23, 0.72);
            backdrop-filter: blur(20px) saturate(1.4);
            z-index: 100;
            height: 56px;
            display: flex;
            align-items: center;
        }
        .navbar::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(59, 130, 246, 0.3) 20%,
                rgba(99, 102, 241, 0.5) 50%,
                rgba(59, 130, 246, 0.3) 80%,
                transparent 100%);
        }
        .nav-inner {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-link { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; }
        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; }
        .status-dot {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.72rem;
            color: var(--text-dim);
            font-weight: 500;
            transition: color 0.3s;
        }
        .status-dot::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }
        .status-dot.disconnected { color: #ef4444; }
        .status-dot.disconnected::before { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ── Main Container ── */
        .main-chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(800px 500px at 30% 20%, rgba(147, 197, 253, 0.12), transparent 60%),
                radial-gradient(600px 400px at 70% 80%, rgba(196, 181, 253, 0.1), transparent 50%),
                radial-gradient(500px 400px at 50% 50%, rgba(244, 114, 182, 0.06), transparent 50%),
                var(--bg);
            background-size: 200% 200%;
            animation: bgDrift 12s ease-in-out infinite alternate;
        }

        /* ── Messages Area ── */
        .chat-scroll-area {
            flex: 1;
            width: 100%;
            max-width: 768px;
            overflow-y: auto;
            padding: 2rem 1.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }
        .chat-scroll-area::-webkit-scrollbar { width: 4px; }
        .chat-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.06); border-radius: 10px; }

        /* ── Welcome Screen ── */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            animation: fadeUp 0.5s ease both;
            gap: 1.5rem;
        }
        .welcome-screen h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 480px;
        }
        .welcome-attach {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .welcome-attach:hover {
            color: var(--text-muted);
            background: var(--surface);
        }
        .welcome-send {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .welcome-send:hover { filter: brightness(1.1); }
        .welcome-send:active { transform: scale(0.92); }

        .welcome-input-area {
            width: 100%;
            max-width: 640px;
        }
        .welcome-input-inner {
            display: flex;
            align-items: flex-end;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 0.35rem 0.35rem 0.35rem 1.1rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .welcome-input-inner:focus-within {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.15);
        }
        .welcome-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.925rem;
            padding: 0.55rem 0;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
            word-wrap: break-word;
            white-space: pre-wrap;
            field-sizing: content;
            min-height: 24px;
            max-height: 120px;
        }
        .welcome-input::placeholder { color: var(--text-dim); }

        .welcome-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }
        .welcome-chips span {
            font-size: 0.82rem;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .welcome-chips span:hover {
            background: var(--surface-hover);
            border-color: rgba(96, 165, 250, 0.3);
            color: var(--text);
        }
        .welcome-chips.fade-out { opacity: 0; transition: opacity 0.3s; }

        /* ── Drag & Drop ── */
        .drop-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        .drop-overlay.active { opacity: 1; pointer-events: auto; }
        .drop-overlay-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
            border: 2px dashed rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.05);
        }
        .drop-overlay-inner svg { color: #60a5fa; }
        .drop-overlay-inner span { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        /* ── Scroll Bottom ── */
        .scroll-bottom-btn {
            position: absolute;
            bottom: 80px;
            right: 50%;
            transform: translateX(384px);
            z-index: 20;
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
        }
        .scroll-bottom-btn.visible { opacity: 1; pointer-events: auto; }
        .scroll-bottom-btn:hover {
            background: rgba(30, 41, 59, 0.95);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.15);
        }
        @media (max-width: 820px) {
            .scroll-bottom-btn, .scroll-bottom-btn:hover {
                right: 1.5rem;
                transform: none;
            }
        }

        /* ── Messages ── */
        .msg {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            width: fit-content;
            max-width: 80%;
            animation: msgIn 0.3s ease both;
        }
        .msg.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }
        .msg.bot {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .msg.bot .msg-avatar {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.1));
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.15);
        }
        .msg.user .msg-avatar {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .msg-bubble {
            font-size: 0.925rem;
            line-height: 1.7;
            position: relative;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            transition: transform 0.2s ease;
        }
        .msg.bot .msg-bubble {
            color: #e2e8f0;
            background: rgba(30, 41, 59, 0.35);
        }
        .msg.user .msg-bubble {
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }
        .msg-bubble p { white-space: pre-wrap; word-break: break-word; }
        .msg-bubble p:empty::before { content: '\200B'; }
        .msg-bubble a { color: #93c5fd; text-decoration: underline; text-underline-offset: 2px; }
        .msg-bubble code {
            background: rgba(0, 0, 0, 0.25);
            padding: 0.15em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .msg-bubble pre {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .msg-bubble pre code { background: none; padding: 0; }

        .stream-cursor {
            width: 2px;
            height: 1.1em;
            background: #60a5fa;
            display: inline-block;
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        .msg-time {
            display: block;
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 0.3rem;
            font-weight: 500;
            opacity: 0.6;
        }
        .msg.user .msg-time { text-align: right; color: rgba(255, 255, 255, 0.45); }

        /* ── Copy Button ── */
        .copy-btn {
            position: absolute;
            top: 0.1rem;
            right: -0.1rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .msg.bot:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: var(--text); background: var(--surface); }

        /* ── Typing Indicator ── */
        .typing-text {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .typing-text .dots {
            display: inline-flex;
            gap: 3px;
            margin-left: 2px;
        }
        .typing-text .dots span {
            width: 5px; height: 5px;
            background: var(--accent);
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite both;
        }
        .typing-text .dots span:nth-child(1) { animation-delay: 0s; }
        .typing-text .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-text .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        /* ── Input Area (bottom) ── */
        .chat-input-wrapper {
            width: 100%;
            padding: 0.5rem 1.5rem 1.25rem;
            background: linear-gradient(to top, var(--bg) 60%, transparent);
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }
        .chat-input-area {
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: flex-end;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 0.35rem 0.35rem 0.35rem 1.1rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }
        .chat-input-area:focus-within {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.15);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.925rem;
            padding: 0.55rem 0;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
            word-wrap: break-word;
            white-space: pre-wrap;
            field-sizing: content;
            min-height: 24px;
            max-height: 120px;
        }
        .chat-input::placeholder { color: var(--text-dim); }

        .chat-attach-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .chat-attach-btn:hover {
            color: var(--text-muted);
            background: var(--surface);
        }
        .chat-send {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-send:hover { filter: brightness(1.1); }
        .chat-send:active { transform: scale(0.92); }
        .chat-send:disabled { opacity: 0.5; cursor: default; pointer-events: none; }

        /* ── Animations ── */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bgDrift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .chat-scroll-area { padding: 1.25rem 1rem 0.5rem; gap: 0.65rem; }
            .msg-bubble { max-width: 92%; font-size: 0.9rem; }
            .msg.user .msg-bubble { padding: 0.65rem 0.85rem; }
            .msg-avatar { width: 26px; height: 26px; min-width: 26px; }
            .chat-input-wrapper { padding: 0.5rem 1rem 1rem; }
            .chat-input-area { border-radius: 24px; padding: 0.3rem 0.3rem 0.3rem 0.9rem; }
            .navbar { height: 52px; }
            .nav-inner { padding: 0 1rem; }
            .welcome-screen h1 { font-size: 1.8rem; }
            .welcome-attach { font-size: 0.8rem; padding: 0.5rem 1rem; }
            .welcome-input-inner { border-radius: 24px; padding: 0.3rem 0.3rem 0.3rem 0.9rem; }
            .welcome-chips span { font-size: 0.78rem; padding: 0.3rem 0.75rem; }
        }
        @media (max-width: 480px) {
            .chat-scroll-area { padding: 1rem 0.75rem 0.5rem; }
            .chat-input-wrapper { padding: 0.5rem 0.75rem 0.875rem; }
            .status-dot { font-size: 0; gap: 0; }
            .status-dot::before { width: 5px; height: 5px; }
            .welcome-screen h1 { font-size: 1.5rem; }
            .welcome-attach { font-size: 0.78rem; padding: 0.45rem 0.9rem; }
            .welcome-input-inner { border-radius: 20px; padding: 0.25rem 0.25rem 0.25rem 0.8rem; }
            .welcome-input { font-size: 0.88rem; }
            .welcome-chips span { font-size: 0.75rem; padding: 0.25rem 0.65rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="logo-link">
                <span class="logo-text">CVision</span>
            </a>
            <div class="nav-right">
                <span class="status-dot" id="statusDot">Connected</span>
            </div>
        </div>
    </nav>

    <!-- Chat Interface -->
    <div class="main-chat-container" id="chatContainer">

        <!-- Drag & Drop Overlay -->
        <div class="drop-overlay" id="dropOverlay">
            <div class="drop-overlay-inner">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                <span>Drop your CV or job description here</span>
            </div>
        </div>

        <!-- Scroll to Bottom -->
        <button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="Scroll to bottom">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>

        <!-- Messages Area -->
        <div class="chat-scroll-area" id="chatMessages">
            <div class="welcome-screen" id="welcomeScreen">
                <h1 id="welcomeHeading">Ready when you are</h1>

                <div class="welcome-input-area">
                    <div class="welcome-input-inner">
                        <textarea class="welcome-input" id="welcomeInput" placeholder="Ask anything..." autocomplete="off" rows="1"></textarea>
                        <button class="welcome-attach" id="welcomeAttachBtn" type="button" aria-label="Attach file">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke-width="2.5"></path>
                            </svg>
                        </button>
                        <button class="welcome-send" id="welcomeSendBtn" type="button" aria-label="Send message">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="welcome-chips" id="chatSuggestions"></div>
            </div>
        </div>

        <!-- Input (hidden until chat starts) -->
        <div class="chat-input-wrapper" id="chatInputWrapper" hidden>
            <div class="chat-input-area">
                <button class="chat-attach-btn" aria-label="Attach File" id="chatAttachBtn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke-width="2.5"></path>
                    </svg>
                </button>

                <input type="file" id="chatFileInput" hidden accept=".pdf,.docx,.txt" />

                <textarea class="chat-input" id="chatInput" placeholder="Message CVision or drop a file..." autocomplete="off" rows="1"></textarea>
                
                <button class="chat-send" type="button" aria-label="Send message" id="chatSendBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
