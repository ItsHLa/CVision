services:
  - type: web
    name: cvision-api
    runtime: python
    repo: https://github.com/your-username/your-repo
    plan: free
    region: oregon
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:server --host 0.0.0.0 --port $PORT
    envVars:
      - key: AGENT_INTERNAL_TOKEN
        sync: false
      - key: AGENT_URL
        sync: false
      - key: PARSER_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: cvision-worker
    runtime: python
    repo: https://github.com/your-username/your-repo
    plan: free
    region: oregon
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && celery -A workers.celery_worker worker --loglevel=info
    envVars:
      - key: AGENT_INTERNAL_TOKEN
        sync: false
      - key: AGENT_URL
        sync: false
      - key: PARSER_URL
        sync: false
      - key: REDIS_URL
        sync: false
